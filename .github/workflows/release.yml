name: Release

# Cutting a release is `git tag v0.3.0 && git push --tags`. Everything below follows
# from the tag: the version in the built plugin, the release, and the entry in
# pluginmaster.json that Dalamud reads.
on:
  push:
    tags: [ 'v*' ]

  # Useful for re-running a release that failed partway without moving the tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # The plugin targets net9.0-windows, so this cannot run on Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch rather than the detached tag: the manifest bump at
          # the end is committed back, and a detached HEAD has nowhere to push it.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # 8 for Core, the tests and the web app; 9 for the plugin itself.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }

          # Dalamud wants four parts in AssemblyVersion.
          $assembly = $version
          while (($assembly -split '\.').Count -lt 4) { $assembly += '.0' }

          "version=$version"   >> $env:GITHUB_OUTPUT
          "assembly=$assembly" >> $env:GITHUB_OUTPUT

          Write-Host "Releasing $version (assembly $assembly)"

      # Dalamud.NET.Sdk compiles against the Dalamud assemblies and does not fetch them
      # itself: it looks for an installed Dalamud, which on a developer's machine
      # XIVLauncher has already put in place. A runner has no XIVLauncher, so without
      # this the plugin has nothing to build against.
      - name: Fetch Dalamud
        shell: pwsh
        run: |
          $hooks = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $hooks | Out-Null

          # The stable branch, to match what players are actually running.
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' `
                            -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $hooks -Force

          Write-Host "Dalamud in place at $hooks"

      # A release that fails its own test suite is not a release.
      - name: Test
        run: dotnet test BlitzballTracker.sln -c Release --nologo

      - name: Build the plugin
        run: >
          dotnet build BlitzballTracker/BlitzballTracker.csproj
          -c Release --nologo
          -p:Version=${{ steps.version.outputs.assembly }}
          -bl:${{ runner.temp }}/build.binlog

      # Workflow logs need a sign-in to read, and the failure annotation says only
      # "exit code 1". A binlog is readable by anyone with the file.
      - name: Keep the build log when it goes wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: ${{ runner.temp }}/build.binlog
          if-no-files-found: warn

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Blitzball Companion ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: BlitzballTracker/bin/Release/BlitzballTracker/latest.zip

      # Dalamud only ever reads pluginmaster.json, so a release nobody can install is
      # one where this step did not run. LastUpdate is a unix timestamp; the installer
      # uses it to decide what is new.
      - name: Point the plugin repository at it
        shell: pwsh
        run: |
          $path = 'pluginmaster.json'
          $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json

          foreach ($entry in $manifest) {
            $entry.AssemblyVersion = '${{ steps.version.outputs.assembly }}'
            $entry.LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          }

          # -AsArray matters more than it looks. ConvertTo-Json unwraps a single-element
          # array into a bare object, and Dalamud requires the file to be an array — so
          # the first release published a manifest no installer could read, while every
          # check that parsed it as JSON still looked fine.
          ConvertTo-Json -InputObject @($manifest) -Depth 10 -AsArray |
            Set-Content -LiteralPath $path -Encoding utf8

          # Verify the shape as text, since parsing it proves nothing about this.
          $written = Get-Content -LiteralPath $path -Raw
          if (-not $written.TrimStart().StartsWith('[')) {
            throw 'pluginmaster.json is not a JSON array; Dalamud would reject it.'
          }

      - name: Commit the manifest
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add pluginmaster.json

          if (git diff --cached --quiet) {
            Write-Host 'Manifest unchanged; nothing to commit.'
            exit 0
          }

          git commit -m "Release ${{ steps.version.outputs.version }}"
          git push origin main
